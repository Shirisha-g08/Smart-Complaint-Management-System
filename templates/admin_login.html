{% extends "base.html" %}
{% block title %}Admin Login — SmartCMS{% endblock %}

{% block content %}
<div class="auth-page d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-9 col-md-6 col-lg-5">

        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4 p-md-5">

            <!-- Header -->
            <div class="text-center mb-4">
              <div class="auth-icon bg-danger bg-opacity-10 text-danger mx-auto mb-3">
                <i class="bi bi-shield-lock-fill fs-3"></i>
              </div>
              <h4 class="fw-bold mb-1">Admin Portal</h4>
              <p class="text-muted small">Restricted access — authorised personnel only</p>
            </div>

            <!-- Form -->
            <form method="POST" action="{{ url_for('admin_login') }}" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Admin Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-envelope text-muted"></i>
                  </span>
                  <input type="email" class="form-control border-start-0 ps-0"
                         id="email" name="email" placeholder="admin@college.edu"
                         required autocomplete="username" />
                </div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-lock text-muted"></i>
                  </span>
                  <input type="password" class="form-control border-start-0 ps-0"
                         id="password" name="password" placeholder="••••••••"
                         required autocomplete="current-password" />
                </div>
              </div>

              <button type="submit" class="btn btn-danger w-100 btn-lg fw-semibold">
                <i class="bi bi-shield-check me-2"></i>Admin Sign In
              </button>
            </form>

            <hr class="my-4" />
            <p class="text-center text-muted small mb-0">
              <a href="{{ url_for('login') }}" class="text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>Back to User Login
              </a>
            </p>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
